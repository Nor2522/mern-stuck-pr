<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DevMotiv — a community where programmers share progress updates, lessons and wins to stay motivated."
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0a0a"
    />
    <title>DevMotiv</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("devmotiv-theme");
          var dark = stored ? stored !== "light" : true;
          if (stored === "system") {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
